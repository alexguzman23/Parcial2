<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Biblioteca Universitaria</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header>
        <h1>Sistema de Biblioteca Universitaria</h1>
        <p>Catálogo de recursos disponibles para préstamo</p>
    </header>

    <main>
        <h2>Catálogo de Materiales</h2>
        
        <table id="tabla-materiales">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Título</th>
                    <th>Tipo</th>
                    <th>Detalle</th>
                    <th>Disponibilidad</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla">
                <!-- Se llena dinámicamente con JavaScript -->
            </tbody>
        </table>
    </main>

    <script src="script.js"></script>
</body>
</html>
